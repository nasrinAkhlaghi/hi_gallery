services:
  postgres:
    image: postgres:16
    container_name: hi-gallery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hi_gallery
      POSTGRES_USER: hi_gallery
      POSTGRES_PASSWORD: hi_gallery_dev
    ports:
      - "5432:5432"
    volumes:
      - hi_gallery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hi_gallery -d hi_gallery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hi_gallery_postgres_data:
